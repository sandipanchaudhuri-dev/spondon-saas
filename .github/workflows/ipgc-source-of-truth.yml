name: IPGC canonical data contract
on:
  pull_request:
    paths:
      - 'ipgc-app/src/app/**'
      - 'scripts/ipgc-source-of-truth.test.mjs'
      - '.github/workflows/ipgc-source-of-truth.yml'
  push:
    branches: [main]
    paths:
      - 'ipgc-app/src/app/**'
      - 'scripts/ipgc-source-of-truth.test.mjs'
      - '.github/workflows/ipgc-source-of-truth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-of-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject hardcoded IPGC registration and gallery snapshots
        run: node --test scripts/ipgc-source-of-truth.test.mjs
